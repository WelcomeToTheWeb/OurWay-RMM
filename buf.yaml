version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    - ENUM_VALUE_PREFIX   # per-message enums are fine for our small set
    - PACKAGE_DIRECTORY_MATCH  # module path is hyphenated (ourway-rmm), proto package underscored (ourway_rmm)
breaking:
  use:
    - FILE
