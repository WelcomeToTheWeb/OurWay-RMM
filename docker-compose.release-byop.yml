# OurWay RMM PRODUCTION — BYO reverse proxy variant (pull and run).
#
# Publishes the API (8080) and SPA (8081) on the host for your own proxy.
# No bundled Caddy edge — you provide your own TLS termination.
#
# Usage:
#   cp .env.prod.example .env.prod   # then set secrets
#   docker compose -f docker-compose.release-byop.yml up -d
#
# Ports: 8080 (API), 8081 (SPA), 50052 (agent mTLS gRPC).
#
# Simplest proxy config: point everything to the SPA port — the frontend
# container serves the SPA and proxies /api, /agent, /healthz to the backend.

name: ourway-rmm-prod

networks:
  ourway-rmm:
    name: ourway-rmm-prod

services:
  timescale:
    image: timescale/timescaledb:2.29.2-pg16
    environment:
      POSTGRES_DB: ourway-rmm
      POSTGRES_USER: ${OURWAY_RMM_PG_USER:-ourway-rmm}
      POSTGRES_PASSWORD: ${OURWAY_RMM_PG_PASSWORD:?set OURWAY_RMM_PG_PASSWORD in .env.prod}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OURWAY_RMM_PG_USER:-ourway-rmm} -d ourway-rmm"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ourway-rmm]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ourway-rmm]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  redis:
    image: redis:7
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ourway-rmm]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, DAC_OVERRIDE]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${OURWAY_RMM_MINIO_USER:-ourway-rmm}
      MINIO_ROOT_PASSWORD: ${OURWAY_RMM_MINIO_PASSWORD:?set OURWAY_RMM_MINIO_PASSWORD in .env.prod}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ourway-rmm]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${OURWAY_RMM_MEILI_MASTER_KEY:?set OURWAY_RMM_MEILI_MASTER_KEY in .env.prod}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ourway-rmm]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  loki:
    image: ghcr.io/welcometotheweb/ourway-rmm-loki:1.3.0
    command: ["-config.file=/etc/loki/loki-local-config.yaml"]
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ourway-rmm]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  server:
    image: ghcr.io/welcometotheweb/ourway-rmm-server:1.3.0
    environment:
      OURWAY_RMM_VERSION: "1.3.0"
      OURWAY_RMM_ADDR: ":8080"
      OURWAY_RMM_GRPC_ADDR: ":50051"
      OURWAY_RMM_GRPC_MTLS_ADDR: ":50052"
      OURWAY_RMM_PUBLIC_URL: ${OURWAY_RMM_PUBLIC_URL:-}
      OURWAY_RMM_GRPC_MTLS_SANs: ${OURWAY_RMM_GRPC_MTLS_SANs:-}
      OURWAY_RMM_DOMAIN: ${OURWAY_RMM_DOMAIN:-localhost}
      OURWAY_RMM_ENV: prod
      OURWAY_RMM_PG_DSN: postgres://${OURWAY_RMM_PG_USER:-ourway-rmm}:${OURWAY_RMM_PG_PASSWORD}@timescale:5432/ourway-rmm?sslmode=disable
      OURWAY_RMM_NATS_URL: nats://nats:4222
      OURWAY_RMM_REDIS_ADDR: redis:6379
      OURWAY_RMM_MINIO_ENDPOINT: http://minio:9000
      OURWAY_RMM_MEILI_ENDPOINT: http://meilisearch:7700
      OURWAY_RMM_MEILI_MASTER_KEY: ${OURWAY_RMM_MEILI_MASTER_KEY}
      OURWAY_RMM_JWT_SECRET: ${OURWAY_RMM_JWT_SECRET:?set OURWAY_RMM_JWT_SECRET in .env.prod}
      OURWAY_RMM_ADMIN_USER: ${OURWAY_RMM_ADMIN_USER:-admin}
      OURWAY_RMM_ADMIN_PASSWORD: ${OURWAY_RMM_ADMIN_PASSWORD:?set OURWAY_RMM_ADMIN_PASSWORD in .env.prod}
      OURWAY_RMM_MIGRATIONS_DIR: /migrations
    ports:
      - "${OURWAY_RMM_HTTP_PORT:-8080}:8080"
      - "${OURWAY_RMM_AGENT_MTLS_PORT:-50052}:50052"
    depends_on:
      timescale:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks: [ourway-rmm]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  frontend:
    image: ghcr.io/welcometotheweb/ourway-rmm-frontend:1.3.0
    ports:
      - "${OURWAY_RMM_FRONTEND_PORT:-8081}:8080"
    networks: [ourway-rmm]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETPCAP, NET_BIND_SERVICE]

volumes:
  timescale-data:
  nats-data:
  redis-data:
  minio-data:
  meili-data:
  loki-data:
